<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Fusion - We Craft Digital Experiences</title>
  <style>
    /* Basic styling */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* Centering everything vertically and horizontally */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    h1 {
      font-size: 3rem;
      color: #2c3e50;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 2rem;
      color: #34495e;
      margin-bottom: 30px;
    }

    p {
      font-size: 1.2rem;
      color: #7f8c8d;
    }

    /* Adding some styling to the footer */
    footer {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      color: #95a5a6;
    }

    /* Styling the "Coming Soon" button */
    .button {
      background-color: #3498db;
      color: white;
      padding: 15px 30px;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 20px;
    }

    .button:hover {
      background-color: #2980b9;
    }

    /* Contact section styling */
    .contact {
      margin-top: 40px;
      font-size: 1.1rem;
      color: #34495e;
    }

    .contact a {
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }

    .contact a:hover {
      color: #2980b9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Fusion</h1>
    <h2>We Craft Digital Experiences</h2>
    <p>Page is under construction. We will be back soon!</p>
    <a href="#" class="button">Stay Tuned</a>

    <!-- Contact Us Section -->
    <div class="contact">
      <p>If you have any questions or inquiries, feel free to reach out to us at:</p>
      <p><a href="mailto:fusion012026@gmail.com">fusion012026@gmail.com</a></p>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Fusion. All rights reserved.</p>
  </footer>

</body>
</html>
